services:
  - type: web
    name: grokbot-trading-desk
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn crokbot.dashboard.server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AUTO_START_DESK
        value: "true"
      - key: EXECUTION_MODE
        value: "paper"
      - key: BROKER
        value: "paper"
      - key: PRIMARY_SYMBOL
        value: "BTCUSDT"
      - key: SECONDARY_SYMBOL
        value: "ETHUSDT"
      - key: INITIAL_BALANCE
        value: "300.0"
      - key: MAX_POSITION_NOTIONAL
        value: "300.0"
      - key: MAX_ORDER_NOTIONAL
        value: "300.0"
      - key: MM_QUOTE_SIZE
        value: "0.001"
      - key: ETH_QUOTE_SIZE
        value: "0.02"
      - key: JEV_CONFIDENCE_FLOOR
        value: "0.60"
      - key: OMNIROUTE_API_KEY
        sync: false
      - key: ETORO_API_KEY
        sync: false
      - key: ETORO_USER_KEY
        sync: false
